language = "C"
header = "/* SpanZIP C API — Auto-generated by cbindgen. DO NOT EDIT.\n * See docs/03-api/ffi-api.md for the authoritative contract. */"
include_guard = "SPANZIP_H"
cpp_compat = true
pragma_once = true
style = "type"
documentation = true
usize_is_size_t = true
sys_includes = ["stdint.h", "stddef.h"]

[parse]
parse_deps = false

[export]
# Rust types already carry the `Spanzip` prefix in their name (per ffi-api.md
# schema), so we must NOT add another one here — that would emit
# `SpanzipSpanzipArchive` in spanzip.h.
item_types = ["enums", "structs", "opaque", "functions", "typedefs"]

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"
