[package]
name = "otterzip-ffi"
description = "OtterZip — C ABI FFI layer (cbindgen)"
publish = false   # shipped as a DLL in the MSIX, not a crates.io package
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
otterzip-core = { path = "../otterzip-core", default-features = false }
thiserror    = { workspace = true }
tracing      = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender   = { workspace = true }
zeroize      = { workspace = true }

[features]
# The libarchive lenient-fallback feature shipped through v0.x and
# was retired at the v1.0 sprint — the in-tree EOCD/CD parser in
# `otterzip-core::backends::lenient_zip` is always on, no native
# dependency required. No features active today; this section is
# kept to make any future per-backend disables easy to land.
default = []

[dev-dependencies]
tempfile = "3"
zip      = { workspace = true }

[build-dependencies]
cbindgen = "0.27"
