[package]
name = "otterzip-cli"
description = "OtterZip — command-line archive tool"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

# Artifact is `otterzip.exe` (not `otterzip-cli.exe`) so it maps 1:1 to
# the MSIX AppExecutionAlias `otterzip.exe` — no rename step at package
# time. The crate name stays `otterzip-cli`.
[[bin]]
name = "otterzip"
path = "src/main.rs"

[dependencies]
otterzip-core = { path = "../otterzip-core" }
clap    = { workspace = true }
anyhow  = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile   = { workspace = true }
