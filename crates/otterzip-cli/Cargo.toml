[package]
name = "otterzip-cli"
description = "OtterZip — command-line archive tool"
publish = false   # shipped as otterzip.exe in the MSIX, not a crates.io package
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

# Artifact is `otterzip-cli.exe`. It can NOT be `otterzip.exe` because
# the WinUI host exe is `OtterZip.exe` and the MSIX payload is
# case-insensitive (APPX1101 collision). The user-facing `otterzip`
# command comes from the MSIX AppExecutionAlias `otterzip.exe`, which
# points at this binary regardless of its on-disk name.
[[bin]]
name = "otterzip-cli"
path = "src/main.rs"

[dependencies]
otterzip-core = { path = "../otterzip-core" }
clap     = { workspace = true }
anyhow   = { workspace = true }
zeroize  = { workspace = true }
# Used by the extract/test/list open path to merge raw byte-split volumes
# (name.7z.001..NNN) into a temp file before opening — mirrors the GUI.
tempfile = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile   = { workspace = true }
