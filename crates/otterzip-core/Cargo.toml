[package]
name = "otterzip-core"
description = "OtterZip — archive format core (ZIP/7z/RAR/TAR/GZIP)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
thiserror = { workspace = true }
tracing   = { workspace = true }
zeroize   = { workspace = true }
rayon     = { workspace = true }
memmap2   = { workspace = true }

libdeflater = { workspace = true }
zstd        = { workspace = true }
bzip2       = { workspace = true }
xz2         = { workspace = true }
flate2      = { workspace = true }
tar         = { workspace = true }
zip         = { workspace = true }
sevenz-rust = { workspace = true }
unrar       = { workspace = true }
lz4_flex    = { workspace = true }
iso9660-rs  = { workspace = true }
gpt_disk_io = { workspace = true }
cab         = { workspace = true }
cfb         = { workspace = true }

# Korean filename handling (always-on — tiny, no native deps).
chardetng   = { workspace = true }
encoding_rs = { workspace = true }
sys-locale  = { workspace = true }

# CRC-32 (SIMD) — feed by the in-tree ZIP writer.
crc32fast   = { workspace = true }

# Note: the libarchive fallback (compress-tools, `libarchive-fallback`
# feature) was retired at the v1.0 sprint. The lenient route now lives
# in-tree at `src/backends/lenient_zip.rs` — pure Rust, no system deps.

[dev-dependencies]
proptest  = { workspace = true }
criterion = { workspace = true }
tempfile  = "3"
# Enable the AES write side-channel of `zip` only for tests so we can build
# an encrypted-ZIP fixture without polluting the production feature set.
zip       = { version = "2", default-features = false, features = ["deflate-zlib-ng", "aes-crypto"] }

[features]
default = []
# Reserved for per-backend disables (e.g. `no-rar`) — none active today.

[[bench]]
name = "extract"
harness = false
