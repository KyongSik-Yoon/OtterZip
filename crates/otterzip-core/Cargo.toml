[package]
name = "otterzip-core"
description = "OtterZip — archive format core (ZIP/7z/RAR/TAR/GZIP)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
thiserror = { workspace = true }
tracing   = { workspace = true }
zeroize   = { workspace = true }
rayon     = { workspace = true }
memmap2   = { workspace = true }

libdeflater = { workspace = true }
zstd        = { workspace = true }
bzip2       = { workspace = true }
xz2         = { workspace = true }
flate2      = { workspace = true }
tar         = { workspace = true }
zip         = { workspace = true }
sevenz-rust = { workspace = true }
unrar       = { workspace = true }
lz4_flex    = { workspace = true }
iso9660-rs  = { workspace = true }
gpt_disk_io = { workspace = true }
cab         = { workspace = true }
cfb         = { workspace = true }

# Korean filename handling (always-on — tiny, no native deps).
chardetng   = { workspace = true }
encoding_rs = { workspace = true }
sys-locale  = { workspace = true }

# libarchive fallback — gated by `libarchive-fallback` feature. When
# OFF, no compress-tools dep is pulled and the lenient route falls
# back to a clear error message. When ON (release builds) the fallback
# handles malformed ZIPs the zip crate rejects.
compress-tools = { workspace = true, optional = true }

[dev-dependencies]
proptest  = { workspace = true }
criterion = { workspace = true }
tempfile  = "3"
# Enable the AES write side-channel of `zip` only for tests so we can build
# an encrypted-ZIP fixture without polluting the production feature set.
zip       = { version = "2", default-features = false, features = ["deflate-zlib-ng", "aes-crypto"] }

[features]
default = []
# 특정 백엔드를 조건부 비활성화할 때 사용 (예: no-rar feature).
# 현재는 all-on. Feature 분리는 필요 시 추후.

# libarchive fallback for malformed archives the zip crate rejects.
# Disabled by default so non-Windows builds + dev iteration don't need
# vcpkg / native libarchive. Release builds enable explicitly.
libarchive-fallback = ["dep:compress-tools"]

[[bench]]
name = "extract"
harness = false
