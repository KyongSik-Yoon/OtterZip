name: .NET CI

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'SpanZIP.sln'
      - '.github/workflows/ci-dotnet.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'SpanZIP.sln'

jobs:
  build:
    name: Build + AOT check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Native spanzip_ffi.dll from Rust build (used by Interop copy target)
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p spanzip-ffi --release

      - name: Restore
        run: dotnet restore SpanZIP.sln

      - name: Build
        run: dotnet build SpanZIP.sln --configuration Release --no-restore /p:Platform=x64

      - name: Test
        run: dotnet test SpanZIP.sln --configuration Release --no-build /p:Platform=x64

      # AOT trim check — ensure no NEW IL2xxx/IL3xxx warnings slip in.
      # Known WebView2 transitive warnings are silenced via NoWarn in
      # SpanZIP.App.csproj; new entries from our own code surface here.
      - name: Publish AOT (smoke)
        run: |
          dotnet publish app\SpanZIP.App\SpanZIP.App.csproj -c Release -r win-x64 /p:Platform=x64 /p:WarningsAsErrors=true

  hardcoding-scan:
    name: UI Hard rules (no literals)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan XAML for literal colors
        run: |
          set +e
          MATCHES=$(grep -rEn '(Background|Foreground|BorderBrush|Color|Fill)\s*=\s*"(#|[A-Z][a-z]+")' app --include='*.xaml' || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::XAML color literals found (use {ThemeResource ...} instead):"
            echo "$MATCHES"
            exit 1
          fi

      - name: Scan C# for new SolidColorBrush(
        run: |
          set +e
          MATCHES=$(grep -rEn 'new\s+SolidColorBrush\s*\(' app --include='*.cs' || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::SolidColorBrush literal construction found:"
            echo "$MATCHES"
            exit 1
          fi

      - name: Verify .resw key parity
        run: |
          # Match only <data name="..."> rows; the previous loose regex also caught
          # schema-level <resheader name="..."> attributes and produced false diffs.
          KO_KEYS=$(grep -oE '<data\s+name="[^"]+"' app/SpanZIP.App/Strings/ko-KR/Resources.resw | sort -u)
          EN_KEYS=$(grep -oE '<data\s+name="[^"]+"' app/SpanZIP.App/Strings/en-US/Resources.resw | sort -u)
          if [ "$KO_KEYS" != "$EN_KEYS" ]; then
            echo "::error::.resw <data> keys are not identical across ko-KR and en-US"
            diff <(echo "$KO_KEYS") <(echo "$EN_KEYS")
            exit 1
          fi
